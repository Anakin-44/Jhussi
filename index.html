<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta name="google" content="notranslate" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Home | MCA Hub</title>
    <!-- Cute & Cozy Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div id="auth-overlay" class="glass-overlay">
      <div class="glass auth-card">
        <div class="auth-header">
          <h1>✨ Welcome ✨</h1>
          <p>Made for my Aru, with love</p>
        </div>

        <div class="input-group">
          <input type="email" id="auth-email" placeholder="Email Address" />
          <input type="password" id="auth-password" placeholder="Password" />
        </div>

        <div class="button-group">
          <button id="login-btn" class="btn">Welcome Back</button>
          <button id="signup-btn" class="btn secondary">Signup</button>
        </div>
      </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Logic -->
    <script src="js/auth.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("Service Worker Registered!", reg))
            .catch((err) => console.log("Service Worker Error", err));
        });
      }
    </script>
  </body>
</html>
